<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="author" content="Khoa Tran">
  <title>Guessing Game</title>
</head>
<body>
  <h1>Guessing Game</h1>
  <p id="demo"></p>

  <script>
    let playAgain = "yes";
    // Outer loop: repeats the game until the player decides to say no
    while (playAgain === "yes") {
      let randomNumber = Math.floor(Math.random() * 10) + 1;
      let guess = 0;
      let guessCount = 0;

      // Inner loop: repeats until the number is guessed
      while (guess !== randomNumber) {
        guess = parseInt(prompt("Guess a number between 1 and 10."));
        guessCount++;

        if (guess > randomNumber) {
          alert("Your guess is too high, guess again.");
        } else if (guess < randomNumber) {
          alert("Your guess is too low, guess again.");
        } else if (guess === randomNumber) {
          alert("Your guessed it in " + guessCount + " guesses!");
        } else {
          alert("That is not a valid number. Guess again.");
        }
      }

      playAgain = prompt("Would you like to play again? Type yes or no.").toLowerCase();
    }
  </script>
</body>
</html>
